plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    mixin {
        useLegacyMixinAp = true
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.3")))

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    /* APIs */
    modCompileOnly 'maven.modrinth:modmenu:17.0.1-beta.1'
//    localRuntime 'maven.modrinth:architectury-api:17.0.6+fabric'
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:21.11.153") {
        exclude(group: "net.fabricmc.fabric-api")
    }
//    localRuntime("io.wispforest:owo-lib:0.12.21+1.21.6") {
//        exclude(group: "net.fabricmc.fabric-api")
//    }
    modLocalRuntime 'maven.modrinth:modmenu:17.0.1-beta.1'
//    localRuntime 'maven.modrinth:fabric-permissions-api:0.6.1'
//    localRuntime("me.fallenbreath:conditional-mixin-fabric:0.6.4")

//    /* Vulkan Mod */
//    compileOnly "maven.modrinth:vulkanmod:0.6.8+1.21.11"
//    compileOnly "maven.modrinth:beryl:0.2.1-alpha"
//
//    /* Particle Rain */
//    compileOnly "maven.modrinth:particle-rain:v4-beta.10+1.21.11-fabric"
//
//    /* A Good Place */
//    compileOnly "maven.modrinth:a-good-place:1.21.11-1.3.2"
//
//    /* Cosy Critters */
//    compileOnly "maven.modrinth:cosy-critters:v0.3.3+1.21.11-fabric"

    // ============ Runtime ==============

//    /* Performance */
    if (true) {
        modLocalRuntime "maven.modrinth:sodium:mc1.21.11-0.8.7-fabric"
        modLocalRuntime 'maven.modrinth:sodium-extra:mc1.21.11-0.8.3+fabric'
        modLocalRuntime 'maven.modrinth:iris:1.10.7+1.21.11-fabric'
        localRuntime "org.antlr:antlr4-runtime:4.13.1"
        localRuntime "io.github.douira:glsl-transformer:3.0.0-pre3"
        localRuntime "org.anarres:jcpp:1.4.14"
    }
//    localRuntime 'maven.modrinth:scalablelux:0.1.6+fabric.c25518a'
    modLocalRuntime 'maven.modrinth:spark:1.10.170-fabric'
//    compileOnly 'maven.modrinth:moreculling:kWU8mVq5' // 1.4.0-beta.1
////    localRuntime 'maven.modrinth:moreculling:ESxkwc6w' // 1.4.0-beta.1
//
//    /* Particle Rain/Pretty Rain */
//    compileOnly "maven.modrinth:particle-rain:v4-beta.5+1.21.11-fabric"
////    localRuntime "maven.modrinth:particle-rain:3.3.6"
    modLocalRuntime("dev.isxander:yet-another-config-lib:3.8.2+1.21.11-fabric") {
        exclude(group: "net.fabricmc.fabric-api")
    }
//
//    /* Effectual */
////    localRuntime 'maven.modrinth:effectual:1.1.0-1.21.8'
////    localRuntime 'maven.modrinth:tlib:1.3.0-1.21.8'
//
//    /* Lodestone */
////    localRuntime "maven.modrinth:lodestonelib:1.21.1-1.7.0.5-fabric" // TODO no 1.21.4 version
//
//    /* Effective */
////    localRuntime "maven.modrinth:effective:2.4.8-1.21.1" // TODO no 1.21.4 version
////    localRuntime fileTree(dir: '../libs', include: 'effective-1.0.2-all.jar')
//
//    /* Particular */
////    localRuntime "maven.modrinth:particular:1.1.1+1.21.4" // TODO: this is a 1.21.4 version

    /* Particle Rain */
    modLocalRuntime "maven.modrinth:particle-rain:v4-beta.10+1.21.11-fabric"

    /* A Good Place */
    modLocalRuntime "maven.modrinth:a-good-place:1.21.11-1.3.2"

    /* Cosy Critters */
    modLocalRuntime "maven.modrinth:cosy-critters:v0.3.3+1.21.11-fabric"

    /* Particle Interactions */
//    localRuntime "maven.modrinth:particle-interactions:0.9.5+26.1-fabric"

//    /* Particle Core */
    modLocalRuntime "maven.modrinth:particle-core:0.3.2+1.21.11"
    modLocalRuntime("me.fzzyhmstrs:fzzy_config:0.7.6+1.21.11") {
        exclude(group: "net.fabricmc.fabric-api")
        exclude(group: "com.terraformersmc")
    }
    modLocalRuntime("me.fallenbreath:conditional-mixin-fabric:0.6.4")
    modLocalRuntime("net.fabricmc:fabric-language-kotlin:1.13.12+kotlin.2.4.0") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    /* Vulkan Mod */
    if (false) {
        modLocalRuntime "maven.modrinth:vulkanmod:0.6.8+1.21.11"
        modLocalRuntime "maven.modrinth:beryl:0.2.1-alpha"
        localRuntime("org.lwjgl:lwjgl-vulkan:3.3.3")
        localRuntime("org.lwjgl:lwjgl-vma:3.3.3")
        localRuntime("org.lwjgl:lwjgl-vma:3.3.3:natives-windows")
//    localRuntime("org.lwjgl:lwjgl-vma:3.3.3:natives-linux")
//    localRuntime("org.lwjgl:lwjgl-vma:3.3.3:natives-macos")
//    localRuntime("org.lwjgl:lwjgl-vma:3.3.3:natives-macos-arm64")
        localRuntime("org.lwjgl:lwjgl-shaderc:3.3.3")
        localRuntime("org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows")
//    localRuntime("org.lwjgl:lwjgl-shaderc:3.3.3:natives-linux")
//    localRuntime("org.lwjgl:lwjgl-shaderc:3.3.3:natives-macos")
//    localRuntime("org.lwjgl:lwjgl-shaderc:3.3.3:natives-macos-arm64")
//    localRuntime("org.lwjgl:lwjgl-vulkan:3.3.3:natives-macos")
//    localRuntime("org.lwjgl:lwjgl-vulkan:3.3.3:natives-macos-arm64")
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

runClient {
    sourceSets {
        main {
            resources {
                srcDirs += "../common/src/main/resources"
//                srcDirs += "../common_legacy_mod_compat/src/main/resources"
            }
        }
    }
}
